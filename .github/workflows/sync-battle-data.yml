name: Sync battle data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-battle-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize upstream catalogs
        id: synchronize
        run: pnpm data:sync

      - name: Stop when the upstream catalogs and assets are unchanged
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/generated/champions-snapshot.json data/generated/item-sprites.json public/items; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit live upstream mappings
        id: live_audit
        if: steps.changes.outputs.changed == 'true'
        run: pnpm data:audit:live

      - name: Validate the synchronized catalogs and assets
        id: validation
        if: steps.changes.outputs.changed == 'true'
        run: pnpm verify:dev

      - name: Commit and push the validated data branch
        id: commit
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          branch="automation/battle-data-sync"
          git config user.name "champions-lab-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated/champions-snapshot.json data/generated/item-sprites.json public/items
          git commit -m "chore(data): sync Champions data and item sprites"
          git checkout -B "$branch"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "HEAD:$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify that production deployment is required
        id: deployment_notification
        if: steps.changes.outputs.changed == 'true' && success()
        uses: actions/github-script@v9
        env:
          DEPLOY_COMMIT: ${{ steps.commit.outputs.sha }}
          SYNC_BRANCH: ${{ steps.commit.outputs.branch }}
        with:
          script: |
            const fs = await import('node:fs/promises');
            const snapshot = JSON.parse(await fs.readFile('data/generated/champions-snapshot.json', 'utf8'));
            const itemSprites = JSON.parse(await fs.readFile('data/generated/item-sprites.json', 'utf8'));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const sourceDate = snapshot.sources?.champions?.generatedAt?.slice(0, 10) ?? 'unknown';
            const dataVersion = snapshot.sources?.champions?.dataVersion ?? 'unknown';
            const commit = process.env.DEPLOY_COMMIT;
            const compareUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/compare/main...${process.env.SYNC_BRANCH}?expand=1`;

            const labels = [
              { name: 'deployment-required', color: 'FBCA04', description: 'Validated changes are waiting for Dev UAT and production promotion.' },
              { name: 'automated-data-sync', color: '1D76DB', description: 'Created or updated by the Champions data synchronization workflow.' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            const title = `[Deploy required] Champions catalogs or assets updated (${sourceDate})`;
            const body = [
              'Updated Champions catalogs or held-item assets passed every automated validation and were pushed to the protected candidate branch.',
              '',
              `- Battle data date: ${sourceDate}`,
              `- Data version: ${dataVersion}`,
              `- Pokémon forms: ${snapshot.counts.pokemon}`,
              `- Moves: ${snapshot.counts.moves}`,
              `- Abilities: ${snapshot.counts.abilities}`,
              `- Held items: ${snapshot.counts.items}`,
              `- Held-item sprites: ${itemSprites.counts.available}/${itemSprites.counts.items}`,
              `- Sprite revision: ${itemSprites.source.revision}`,
              '- Validation: Passed',
              `- Commit: ${commit}`,
              `- Candidate branch: ${process.env.SYNC_BRANCH}`,
              `- Open pull request: ${compareUrl}`,
              `- Workflow run: ${runUrl}`,
              '',
              '## Next action',
              '',
              '- Deploy this exact candidate commit to Champions Lab Dev before opening a pull request.',
              '- Complete product-owner UAT for that exact Dev commit.',
              '- After UAT approval, create a pull request through Codex or GitHub and run the normal PR checks and independent review.',
              '- Obtain separate approval before production promotion.',
              '- Add the production URL and close this issue after the approved deployment and smoke test.',
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'deployment-required',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => !issue.pull_request);
            const issue = {
              owner,
              repo,
              title,
              body,
              assignees: [owner],
              labels: labels.map((label) => label.name),
            };
            if (existing) {
              await github.rest.issues.update({ ...issue, issue_number: existing.number });
              core.notice(`Updated deployment issue #${existing.number}.`);
            } else {
              const { data: created } = await github.rest.issues.create(issue);
              core.notice(`Created deployment issue #${created.number}.`);
            }

      - name: Resolve a previous sync failure notification
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'sync-failed',
              per_page: 100,
            });
            for (const issue of openIssues.filter((entry) => !entry.pull_request)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `A later synchronization run succeeded: ${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }

      - name: Notify that synchronization failed
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const label = {
              name: 'sync-failed',
              color: 'D73A4A',
              description: 'The automated Champions data synchronization requires attention.',
            };
            try {
              await github.rest.issues.createLabel({ owner, repo, ...label });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const title = '[Sync failed] Champions battle data refresh needs attention';
            const body = [
              'The automated Champions data synchronization did not complete successfully.',
              '',
              `- Branch: ${process.env.GITHUB_REF_NAME}`,
              `- Commit: ${context.sha}`,
              `- Workflow run: ${runUrl}`,
              '',
              'The currently deployed site and last validated snapshot were not replaced.',
            ].join('\n');
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label.name,
              per_page: 100,
            });
            const existing = openIssues.find((issue) => !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body, assignees: [owner], labels: [label.name] });
              core.notice(`Updated sync failure issue #${existing.number}.`);
            } else {
              const { data: created } = await github.rest.issues.create({ owner, repo, title, body, assignees: [owner], labels: [label.name] });
              core.notice(`Created sync failure issue #${created.number}.`);
            }

      - name: Publish synchronization summary
        if: always()
        uses: actions/github-script@v9
        env:
          SYNC_CHANGED: ${{ steps.changes.outputs.changed || 'unknown' }}
          SYNC_OUTCOME: ${{ steps.synchronize.outcome || 'not_run' }}
          LIVE_AUDIT_OUTCOME: ${{ steps.live_audit.outcome || 'not_run' }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome || 'not_run' }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome || 'not_run' }}
          DEPLOYMENT_NOTIFICATION_OUTCOME: ${{ steps.deployment_notification.outcome || 'not_run' }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = await import('node:fs/promises');

            let snapshot;
            let itemSprites;
            try {
              snapshot = JSON.parse(await fs.readFile('data/generated/champions-snapshot.json', 'utf8'));
              itemSprites = JSON.parse(await fs.readFile('data/generated/item-sprites.json', 'utf8'));
            } catch (error) {
              core.warning(`Could not read the generated catalogs for the run summary: ${error.message}`);
            }

            const changed = process.env.SYNC_CHANGED;
            const result = process.env.JOB_STATUS;
            const statusText = changed === 'true' && process.env.COMMIT_OUTCOME === 'success'
              ? 'Upstream changes were found and the validated catalogs and assets were pushed to the candidate branch.'
              : changed === 'true'
                ? 'Upstream changes were found, but the new catalogs or assets were not pushed to the automation branch.'
              : changed === 'false'
                ? 'The upstream sources were checked and no data changes were found.'
                : 'The workflow stopped before it could determine whether upstream data changed.';
            const deploymentStatus = changed === 'true' && process.env.DEPLOYMENT_NOTIFICATION_OUTCOME === 'success'
              ? 'Dev UAT required: deploy the exact candidate commit first; create the pull request only after product-owner approval.'
              : changed === 'true' && process.env.COMMIT_OUTCOME === 'success'
                ? 'The snapshot branch was pushed, but the deployment notification failed; inspect this run.'
              : changed === 'false' && result === 'success'
                ? 'Not required.'
                : 'Not created; investigate this workflow run.';
            const sourceDate = snapshot?.sources?.champions?.generatedAt?.slice(0, 10) ?? 'Unavailable';
            const dataVersion = snapshot?.sources?.champions?.dataVersion ?? 'Unavailable';
            const itemSpriteRevision = itemSprites?.source?.revision ?? 'Unavailable';
            const itemSpriteCount = itemSprites?.counts
              ? `${itemSprites.counts.available}/${itemSprites.counts.items}`
              : 'Unavailable';

            await core.summary
              .addHeading('Champions battle data synchronization')
              .addRaw(statusText)
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Result', header: true }],
                ['Checked at (UTC)', new Date().toISOString()],
                ['Workflow result', result],
                ['Upstream Champions date', sourceDate],
                ['Upstream data version', String(dataVersion)],
                ['Held-item sprites', itemSpriteCount],
                ['Item sprite revision', itemSpriteRevision],
                ['Changes detected', changed],
                ['Synchronization step', process.env.SYNC_OUTCOME],
                ['Live mapping audit', process.env.LIVE_AUDIT_OUTCOME],
                ['Validation step', process.env.VALIDATION_OUTCOME],
                ['Commit step', process.env.COMMIT_OUTCOME],
                ['Deployment notification step', process.env.DEPLOYMENT_NOTIFICATION_OUTCOME],
                ['Production deployment', deploymentStatus],
              ])
              .addLink('Open this workflow run', `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`)
              .write();
